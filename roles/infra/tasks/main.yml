---
# Rola infra — uruchamia stos infrastrukturalny środowiska:
# postgres, keycloak, cloudflared.
# Tworzy sieć {{ internal_network_name }}, na której działają serwisy aplikacyjne.
# Idempotentna — kolejne uruchomienia nie restartują działających kontenerów.

# Rola renderuje wyłącznie docker-compose.infra.yml — obecność starego docker-compose.yml
# powoduje, że ręczne docker compose bez -f trafia w nieaktualną konfigurację.
- name: Usuń stary docker-compose.yml (jeśli istnieje)
  ansible.builtin.file:
    path: "{{ infra_dir }}/docker-compose.yml"
    state: absent

- name: Sprawdź czy realm.json Keycloaka istnieje na hoście
  ansible.builtin.stat:
    path: "{{ infra_dir }}/keycloak/realm.json"
  register: _kc_realm

- name: Utwórz katalog importu Keycloaka (zawsze, nawet pusty)
  ansible.builtin.file:
    path: "{{ infra_dir }}/keycloak"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Wygeneruj docker-compose.infra.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ infra_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"

- name: Zapisz .env infrastruktury (tryb 0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ infra_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0600"

- name: Utwórz sieć środowiskową {{ internal_network_name }}
  community.docker.docker_network:
    name: "{{ internal_network_name }}"
    driver: bridge
    state: present

- name: docker compose pull (infra)
  ansible.builtin.command:
    cmd: >
      docker compose
      --project-name {{ infra_project }}
      --env-file {{ infra_dir }}/.env
      -f {{ infra_dir }}/docker-compose.yml
      pull postgres keycloak cloudflared
  changed_when: true

- name: docker compose up -d (infra)
  ansible.builtin.command:
    cmd: >
      docker compose
      --project-name {{ infra_project }}
      --env-file {{ infra_dir }}/.env
      -f {{ infra_dir }}/docker-compose.yml
      up -d postgres keycloak cloudflared
  changed_when: true

- name: Czekaj na postgres healthy
  ansible.builtin.command:
    cmd: >
      docker inspect
      {% raw %}--format={{.State.Health.Status}}{% endraw %}
      reachsky-{{ env_name }}-postgres
  register: _pg_health
  retries: "{{ health_retries }}"
  delay:   "{{ health_delay_seconds }}"
  until:   _pg_health.stdout == "healthy"
  changed_when: false

- name: Czekaj na keycloak healthy
  ansible.builtin.command:
    cmd: >
      docker inspect
      {% raw %}--format={{.State.Health.Status}}{% endraw %}
      reachsky-{{ env_name }}-keycloak
  register: _kc_health
  retries: "{{ health_retries }}"
  delay:   "{{ health_delay_seconds }}"
  until:   _kc_health.stdout == "healthy"
  changed_when: false

- name: Infrastruktura gotowa
  ansible.builtin.debug:
    msg: "OK [{{ env_name }}] — postgres i keycloak healthy, sieć {{ internal_network_name }} aktywna"
