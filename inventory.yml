---
# inventory.yml — uruchomienie zdalne (z laptopa przez SSH).
# ansible_host pochodzi z group_vars/all/vars.yml (lookup env ANSIBLE_HOST).

all:
  children:
    prod:
      hosts:
        reachsky-prod: {}
    demo:
      hosts:
        reachsky-demo: {}
    # Jeden runner na serwer fizyczny — runner.yml używa tej grupy.
    runner:
      hosts:
        reachsky-prod: {}
