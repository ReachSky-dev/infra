---
# runner.yml — instaluje i rejestruje GitHub Actions self-hosted runner.
# Uruchamiany jednorazowo na serwerze (po bootstrapie przez site.yml).
#
# Jeden runner obsługuje oba środowiska — etykieta "reachsky" trafia do
# runs-on w workflow; środowisko wybierane przez Ansible (-l prod/-l demo).
#
# Użycie:
#   ansible-playbook -i inventory.local.yml playbooks/runner.yml \
#     -e "runner_token=<jednorazowy-token>"
#
#   # Przypięcie konkretnej wersji (gdy "latest" coś zepsuje):
#   ansible-playbook -i inventory.local.yml playbooks/runner.yml \
#     -e "runner_token=<TOKEN>" -e "runner_version=2.329.0"
#
# Token: GitHub → repo infra → Settings → Actions → Runners → New self-hosted runner
#         → Linux → skopiuj wartość po --token z wyświetlonej komendy
# Token wygasa po 1h lub po pierwszym użyciu. NIE wstawiaj do vault ani kodu.

- name: ReachSky — GitHub Actions self-hosted runner
  hosts: runner          # jawna grupa — jeden runner na serwer fizyczny
  become: true
  gather_facts: true     # potrzebne dla ansible_hostname w runner_name

  vars:
    runner_user:    github-runner
    runner_group:   github-runner
    runner_home:    /home/github-runner
    runner_dir:     /home/github-runner/actions-runner
    runner_name:    "reachsky-{{ ansible_hostname }}"
    runner_labels:  "self-hosted,linux,reachsky"
    # Domyślnie pobiera najnowszą wersję z GitHub API.
    # Aby przypiąć konkretną: -e "runner_version=2.329.0"
    runner_version: "latest"
    github_repo_url: "{{ _github_repo_url | default('https://github.com/ReachSky-dev/infra') }}"

  tasks:

    - name: Sprawdź czy runner_token podano
      ansible.builtin.fail:
        msg: >
          runner_token jest wymagany.
          Użycie: ansible-playbook -i inventory.local.yml playbooks/runner.yml
                    -e "runner_token=<TOKEN>"
          Pobierz token z: GitHub → repo → Settings → Actions →
            Runners → New self-hosted runner → Linux → skopiuj wartość po --token
      when: runner_token is not defined or runner_token | length == 0

    # ── Wersja runnera ────────────────────────────────────────────────────────
    - name: Pobierz najnowszą wersję runnera z GitHub API
      ansible.builtin.uri:
        url: https://api.github.com/repos/actions/runner/releases/latest
        return_content: true
        headers:
          Accept: application/vnd.github+json
      register: _latest_release
      changed_when: false
      when: runner_version == 'latest'

    - name: Ustaw docelową wersję runnera
      ansible.builtin.set_fact:
        _resolved_version: >-
          {{ (_latest_release.json.tag_name | regex_replace('^v', ''))
             if runner_version == 'latest'
             else runner_version }}

    - name: Pokaż wersję runnera do instalacji
      ansible.builtin.debug:
        msg: "runner_version={{ _resolved_version }}{{ ' (z GitHub API)' if runner_version == 'latest' else ' (przypięta)' }}"

    # ── Zależności systemowe ──────────────────────────────────────────────────
    - name: Zainstaluj zależności runnera
      ansible.builtin.package:
        name: [curl, tar, git]
        state: present

    # ── Użytkownik runnera ────────────────────────────────────────────────────
    - name: Utwórz grupę runnera
      ansible.builtin.group:
        name: "{{ runner_group }}"
        state: present

    - name: Utwórz użytkownika runnera
      ansible.builtin.user:
        name: "{{ runner_user }}"
        group: "{{ runner_group }}"
        shell: /bin/bash
        create_home: true
        home: "{{ runner_home }}"
        state: present

    # NOPASSWD: ALL wymagane przez Ansible become: true (generuje skrypty w /tmp).
    # Sekrety nigdy nie leżą trwale na dysku — przekazywane przez env: w CI,
    # source /opt/reachsky/.deploy-env przy ręcznych uruchomieniach.
    - name: Uprawnienia sudo dla runnera (ansible become)
      ansible.builtin.copy:
        content: |
          # GitHub Actions runner — ansible-playbook wymaga become: true
          {{ runner_user }} ALL=(ALL) NOPASSWD: ALL
        dest: /etc/sudoers.d/github-runner
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    # ── Pobierz i zweryfikuj archiwum ─────────────────────────────────────────
    - name: Sprawdź czy runner już pobrany
      ansible.builtin.stat:
        path: "{{ runner_dir }}/run.sh"
      register: _runner_bin

    - name: Utwórz katalog runnera
      ansible.builtin.file:
        path: "{{ runner_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_group }}"
        mode: "0750"

    - name: Pobierz plik SHA-256 z GitHub Releases
      ansible.builtin.uri:
        url: >-
          https://github.com/actions/runner/releases/download/v{{ _resolved_version }}/actions-runner-linux-x64-{{ _resolved_version }}.tar.gz.sha256
        return_content: true
      register: _sha256_file
      changed_when: false
      when: not _runner_bin.stat.exists

    - name: Wyodrębnij sumę SHA-256
      ansible.builtin.set_fact:
        # Plik zawiera "<hash>  <filename>" — bierzemy pierwsze pole
        _sha256: "{{ _sha256_file.content.split()[0] }}"
      when: not _runner_bin.stat.exists

    - name: Pobierz archiwum runnera (z weryfikacją sumy SHA-256)
      ansible.builtin.get_url:
        url: >-
          https://github.com/actions/runner/releases/download/v{{ _resolved_version }}/actions-runner-linux-x64-{{ _resolved_version }}.tar.gz
        dest: "/tmp/actions-runner-linux-x64-{{ _resolved_version }}.tar.gz"
        checksum: "sha256:{{ _sha256 }}"
        mode: "0644"
      when: not _runner_bin.stat.exists

    - name: Wypakuj archiwum runnera
      ansible.builtin.unarchive:
        src: "/tmp/actions-runner-linux-x64-{{ _resolved_version }}.tar.gz"
        dest: "{{ runner_dir }}"
        owner: "{{ runner_user }}"
        group: "{{ runner_group }}"
        remote_src: true
      when: not _runner_bin.stat.exists

    # ── Rejestracja runnera ───────────────────────────────────────────────────
    - name: Sprawdź czy runner już zarejestrowany
      ansible.builtin.stat:
        path: "{{ runner_dir }}/.runner"
      register: _runner_cfg

    # no_log: true chroni --token w argv przed pojawieniem się w logach.
    # Nie ukrywa stdout/stderr config.sh — te trafiają do _reg_result
    # i są wyświetlane w kolejnym kroku (token nie pojawia się w outputcie config.sh).
    # failed_when: false — błąd obsługujemy ręcznie, żeby zawsze widzieć output.
    - name: Zarejestruj runnera w GitHub
      ansible.builtin.command:
        argv:
          - "{{ runner_dir }}/config.sh"
          - --unattended
          - --url
          - "{{ github_repo_url }}"
          - --token
          - "{{ runner_token }}"
          - --name
          - "{{ runner_name }}"
          - --labels
          - "{{ runner_labels }}"
        chdir: "{{ runner_dir }}"
      become_user: "{{ runner_user }}"
      become: true
      when: not _runner_cfg.stat.exists
      no_log: true          # chroni --token w argv
      register: _reg_result
      failed_when: false    # błąd obsługujemy poniżej — żeby zawsze widzieć output

    - name: Pokaż output config.sh (token nie pojawia się w stdout/stderr)
      ansible.builtin.debug:
        msg: "{{ (_reg_result.stdout_lines | default([])) + (_reg_result.stderr_lines | default([])) }}"
      when: not _runner_cfg.stat.exists

    - name: Fail jeśli rejestracja nie powiodła się
      ansible.builtin.fail:
        msg: >
          Rejestracja runnera nie powiodła się (rc={{ _reg_result.rc }}).
          Sprawdź output powyżej. Najczęstsze przyczyny:
          - token wygasł (ważny 1h od wygenerowania)
          - runner o nazwie "{{ runner_name }}" już istnieje w GitHub
            (GitHub → repo → Settings → Actions → Runners → usuń stary)
      when: not _runner_cfg.stat.exists and _reg_result.rc != 0

    - name: Rejestracja powiodła się
      ansible.builtin.debug:
        msg: "Runner {{ runner_name }} zarejestrowany. Etykiety: {{ runner_labels }}"
      when: not _runner_cfg.stat.exists and _reg_result.rc == 0

    # ── Usługa systemd ────────────────────────────────────────────────────────
    - name: Sprawdź czy usługa systemd już zainstalowana
      ansible.builtin.shell:
        cmd: "systemctl list-unit-files 'actions.runner.*' --no-legend | awk '{print $1}' | head -1"
      register: _svc_exists
      changed_when: false

    - name: Zainstaluj usługę systemd
      ansible.builtin.command:
        cmd: "{{ runner_dir }}/svc.sh install {{ runner_user }}"
        chdir: "{{ runner_dir }}"
      when: _svc_exists.stdout | length == 0
      changed_when: true

    - name: Pobierz nazwę usługi systemd
      ansible.builtin.shell:
        cmd: "systemctl list-unit-files 'actions.runner.*' --no-legend | awk '{print $1}' | head -1"
      register: _svc_name
      changed_when: false

    - name: Uruchom i włącz usługę runnera
      ansible.builtin.systemd:
        name: "{{ _svc_name.stdout }}"
        state: started
        enabled: true
        daemon_reload: true
      when: _svc_name.stdout | length > 0

    # ── Wynik ─────────────────────────────────────────────────────────────────
    - name: Status runnera
      ansible.builtin.command:
        cmd: "{{ runner_dir }}/svc.sh status"
        chdir: "{{ runner_dir }}"
      changed_when: false
      register: _runner_status
      failed_when: false

    - name: Runner — podsumowanie
      ansible.builtin.debug:
        msg:
          - "Nazwa:    {{ runner_name }}"
          - "Wersja:   {{ _resolved_version }}"
          - "Etykiety: {{ runner_labels }}"
          - "Repo:     {{ github_repo_url }}"
          - "{{ _runner_status.stdout_lines | default(['(brak statusu)']) }}"
